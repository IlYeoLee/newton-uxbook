<script>
  const book = document.getElementById('book');
  const pages = [...document.querySelectorAll('.page')];
  const ids = pages.map(p => p.dataset.page);
  const pills = [...document.querySelectorAll('.pill')];
  const counter = document.getElementById('counter');
  let idx = 0;

  // mobile: swap hero cards to their hi-res 16:9 variants (desktop keeps the portrait crop)
  if (matchMedia('(max-width:640px)').matches)
    document.querySelectorAll('img[data-msrc]').forEach(im => { im.src = im.dataset.msrc; });

  function updateChrome(){
    book.classList.toggle('is-cover', ids[idx] === 'cover');
    pills.forEach(p => p.classList.toggle('active', p.dataset.members.split(',').includes(ids[idx])));
    counter.innerHTML = '<span class="cur">' + idx + '</span><span class="tot"> / ' + (pages.length - 1) + '</span>';
    document.getElementById('prevBtn').disabled = false;   // 앞뒤 모두 순환한다
    if (typeof updateHint === 'function') updateHint();
  }

  // stagger the page's own elements in from the top ("차라락"), any direction
  function staggerIn(page){
    // one system: covers both layouts (two-column: media + text, vertical: head/content/hero)
    const items = [
      page.querySelector('.page-media'),
      ...page.querySelectorAll('.page-text > *'),
      ...page.querySelectorAll('.head-block'),
      ...page.querySelectorAll('.page-content > *'),
      page.querySelector('.page-hero'),
    ].filter(Boolean);
    items.forEach((el, n) => {
      el.classList.remove('stagger');
      void el.offsetWidth;                    // restart animation
      el.style.animationDelay = (n * 55) + 'ms';
      el.classList.add('stagger');
    });
  }

  function resetPage(p){
    // fresh state on entry: close every toggle, clear inline anim, scroll to top
    p.querySelectorAll('details.toggle').forEach(d => {
      d.open = false;
      const b = d.querySelector(':scope > .toggle-body');
      if (b) { b.style.height = ''; b.style.opacity = ''; b.style.overflow = ''; b.style.transition = ''; }
    });
    p.scrollTo(0, 0);   // mobile: the whole page scrolls
    p.querySelector('.page-text')?.scrollTo(0, 0);
    p.querySelector('.page-scroll')?.scrollTo(0, 0);
  }
  function show(i){
    // 표지에서 뒤로도 넘어간다 — 앞뒤 양쪽으로 순환한다(다음은 원래 순환이었다)
    if (i < 0) i = pages.length - 1;
    else if (i >= pages.length) i = 0;
    if (i === idx) return;
    const prev = idx;
    idx = i;
    resetPage(pages[i]);
    // Cover transitions toggle is-cover (hides nav, resizes stage), reflowing the still-visible
    // fading page — its title jumps ~140px for the 0.3s fade. Swap cover transitions INSTANTLY
    // (transition:none, no position tricks → nothing escapes the overflow clip, so no spill) so
    // the opaque cover covers everything at once and no reflow is ever seen through the fade.
    if (prev === 0 || i === 0) {
      const a = pages[prev], b = pages[i];
      a.style.transition = b.style.transition = 'none';
      requestAnimationFrame(() => requestAnimationFrame(() => { a.style.transition = b.style.transition = ''; }));
    }
    pages.forEach((p, n) => p.classList.toggle('active', n === i));
    updateChrome();
    staggerIn(pages[i]);   // slide-in plays going forward AND backward
    pageMedia(pages[prev], false);   // 떠난 페이지의 영상은 멈춘다
    pageMedia(pages[i], true);       // 들어온 페이지의 영상은 첫 프레임부터
  }

  // ---- 시나리오 영상: 스크롤 자동재생 + 재생바/사운드 ----
  (function scenarioVideo(){
    const figs = [...document.querySelectorAll('.v-figure')];
    if (!figs.length) return;
    const fmt = s => { s = Math.max(0, s | 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
    const setIcon = (btn, id) => btn.querySelector('use').setAttribute('href', '#' + id);

    figs.forEach(fig => {
      const v = fig.querySelector('video');
      const play = fig.querySelector('.v-play');
      const seek = fig.querySelector('.v-seek');
      const fill = fig.querySelector('.v-fill');
      const time = fig.querySelector('.v-time');
      const snd  = fig.querySelector('.v-sound');

      const sync = () => {
        setIcon(play, v.paused ? 'ic-play' : 'ic-pause');
        play.setAttribute('aria-pressed', String(!v.paused));
        play.setAttribute('aria-label', v.paused ? '재생' : '일시정지');
      };
      v.addEventListener('play', sync);
      v.addEventListener('pause', sync);
      // 사용자가 직접 멈춘 영상은 다시 스크롤해도 자동으로 재생하지 않는다
      play.addEventListener('click', () => {
        if (v.paused) { v.dataset.userPaused = '0'; v.play().catch(() => {}); }
        else { v.dataset.userPaused = '1'; v.pause(); }
      });

      v.addEventListener('timeupdate', () => {
        const p = v.duration ? v.currentTime / v.duration : 0;
        fill.style.width = (p * 100) + '%';
        seek.setAttribute('aria-valuenow', Math.round(p * 100));
        time.textContent = fmt(v.currentTime);
      });

      const scrub = e => {
        const r = seek.getBoundingClientRect();
        if (v.duration) v.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * v.duration;
      };
      seek.addEventListener('pointerdown', e => { seek.setPointerCapture(e.pointerId); scrub(e); });
      seek.addEventListener('pointermove', e => { if (seek.hasPointerCapture(e.pointerId)) scrub(e); });
      seek.addEventListener('keydown', e => {
        if (!v.duration) return;
        if (e.key === 'ArrowRight') v.currentTime = Math.min(v.duration, v.currentTime + 5);
        else if (e.key === 'ArrowLeft') v.currentTime = Math.max(0, v.currentTime - 5);
        else return;
        e.preventDefault();
      });

      if (snd) snd.addEventListener('click', () => {
        v.muted = !v.muted;
        snd.setAttribute('aria-pressed', String(!v.muted));
        snd.setAttribute('aria-label', v.muted ? '소리 켜기' : '소리 끄기');
        setIcon(snd, v.muted ? 'ic-mute' : 'ic-sound');
      });
      sync();
    });

    // 본문 영상은 스크롤이 재생을 정한다. 시점은 영상 하단이 대지(스크롤 영역) 하단에
    // 닿는 순간이고, 영상이 대지보다 크면 그 순간이 오지 않으므로 60% 진입으로 대신한다.
    // 전면 영상(.lead-page)은 스크롤이 없어 페이지 전환이 재생을 정한다(아래 pageMedia).
    const scrolled = new Map();
    figs.forEach(f => {
      const r = f.closest('.page-scroll');
      if (!r) return;
      if (!scrolled.has(r)) scrolled.set(r, []);
      scrolled.get(r).push(f);
    });
    scrolled.forEach((list, root) => {
      const io = new IntersectionObserver(entries => {
        for (const e of entries) {
          const v = e.target.querySelector('video');
          if (!v) continue;
          const rb = e.rootBounds, b = e.boundingClientRect;
          if (!e.isIntersecting) { v.pause(); continue; }
          if (v.dataset.userPaused === '1') continue;
          const reached = rb && (b.bottom <= rb.bottom + 1 ||
                                 (b.height > rb.height && e.intersectionRatio >= 0.6));
          if (reached) v.play().catch(() => {});
        }
      }, { root, threshold: [0, 0.2, 0.4, 0.6, 0.8, 0.95, 1] });
      list.forEach(f => io.observe(f));
    });
  })();

  // ---- 마지막 장: 목걸이에 매달린 크레딧 카드 ----
  // reactbits 의 Lanyard 는 three + rapier 물리다. 이 책은 바닐라라 같은 감각을
  // 베를레 적분 로프로 직접 만든다. 노드 N개를 중력으로 떨구고 거리 구속을 몇 번
  // 반복하면 줄의 출렁임이 나온다. 카드는 로프 끝 노드에 매달린다.
  (function lanyard(){
    const stage = document.getElementById('lanyStage');
    if (!stage) return;
    const page = stage.closest('.credits-page');
    const dim = page.querySelector('.cc-dim');
    const closeBtn = page.querySelector('.cc-close');
    const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    const SEG = 14, ITER = 8, GRAV = 0.55, DAMP = 0.90;
    const ropes = [];

    [...stage.querySelectorAll('.lany')].forEach(el => {
      const card = el.querySelector('.cc');
      const paths = [...el.querySelectorAll('.rp-band')];
      const clip = el.querySelector('.lany-clip');
      // 카드마다 바람 위상을 다르게 준다 — 같은 위상이면 다섯 장이 한 몸처럼 움직인다
      // 줄에 찍히는 워드마크 — 앱바와 같은 로고를 일정 간격으로 반복한다
      const logoG = el.querySelector('.rp-logos');
      const logos = [];
      for (let k = 0; k < 6; k++) {
        const im = document.createElementNS('http://www.w3.org/2000/svg', 'image');
        im.setAttribute('href', 'assets/wordmark.svg');
        im.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        logoG.appendChild(im);
        logos.push(im);
      }
      const r = { el, card, paths, clip, logos, pts: [], len: 0, anchor: {x:0,y:0},
                  drag: null, tilt: {x:0,y:0}, zoom: false, phase: ropes.length * 1.73 };
      ropes.push(r);

      // 드래그: 로프 끝을 포인터로 끌고 다닌다
      card.addEventListener('pointerdown', e => {
        if (page.classList.contains('zoomed')) return;
        card.setPointerCapture(e.pointerId);
        card.classList.add('grabbing');
        const b = stage.getBoundingClientRect();
        r.drag = { x: e.clientX - b.left, y: e.clientY - b.top, moved: 0 };
      });
      card.addEventListener('pointermove', e => {
        const b = stage.getBoundingClientRect();
        if (r.drag) {
          const nx = e.clientX - b.left, ny = e.clientY - b.top;
          r.drag.moved += Math.abs(nx - r.drag.x) + Math.abs(ny - r.drag.y);
          r.drag.x = nx; r.drag.y = ny;
          return;
        }
        // 호버 틸트 (reactbits TiltedCard)
        if (reduce || page.classList.contains('zoomed')) return;
        const c = card.getBoundingClientRect();
        r.tilt.y = ((e.clientX - c.left) / c.width - .5) * 27;
        r.tilt.x = -((e.clientY - c.top) / c.height - .5) * 27;
      });
      const release = e => {
        card.classList.remove('grabbing');
        if (r.drag && r.drag.moved < 6) open(r);   // 끌지 않고 눌렀으면 확대
        r.drag = null;
      };
      card.addEventListener('pointerup', release);
      card.addEventListener('pointercancel', release);
      // 확대 중엔 pointerdown 이 일찍 빠져나가 드래그 판정이 안 생긴다.
      // 그래서 플립은 click 으로 따로 받는다.
      card.addEventListener('click', () => {
        if (r.zoom) r.card.classList.toggle('flipped');
      });
      card.addEventListener('pointerleave', () => { r.tilt.x = r.tilt.y = 0; });
      card.addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        page.classList.contains('zoomed') ? card.classList.toggle('flipped') : open(r);
      });
    });

    // 확대하는 순간 물리를 통째로 멈춘다. 줄과 나머지 카드는 그 자리에 얼어붙고,
    // 고른 카드만 가운데로 미끄러져 들어온다. transform-origin 이 (50%,0) 이라
    // tx = W/2 - cw/2, ty = (H - ch*s)/2 이면 정확히 화면 중앙에 놓인다.
    let frozen = false;
    const ZOOM_MS = 460;

    function centerTransform(r){
      const b = stage.getBoundingClientRect();
      const cw = r.card.offsetWidth, ch = r.card.offsetHeight;
      const s = Math.min(b.width * 0.33 / cw, b.height * 0.82 / ch);
      // 확대 중엔 transform-origin 을 0 0 으로 바꾼다. 좌상단이 곧 결과 위치라
      // (50% 0 기준의 보정 계산 없이) 가운데 정렬이 흔들리지 않는다.
      return `translate(${(b.width - cw * s) / 2}px,${(b.height - ch * s) / 2}px) scale(${s})`;
    }
    function ropeTransform(r){
      const end = r.pts[SEG], prev = r.pts[SEG - 1];
      const ang = Math.atan2(end.x - prev.x, end.y - prev.y) * -180 / Math.PI;
      return `translate(${end.x - r.card.offsetWidth / 2}px,${end.y}px) rotate(${ang}deg)`;
    }

    function open(r){
      if (page.classList.contains('zoomed')) { r.card.classList.toggle('flipped'); return; }
      frozen = true;                       // 여기서 모든 움직임이 선다
      ropes.forEach(o => { o.tilt.x = o.tilt.y = 0; o.drag = null; });
      page.classList.add('zoomed');
      r.el.classList.add('on');
      r.zoom = true;
      r.card.style.transformOrigin = '0 0';
      r.card.style.transition = `transform ${ZOOM_MS}ms cubic-bezier(.22,.7,.24,1)`;
      r.card.style.transform = centerTransform(r);
    }
    function close(){
      const r = ropes.find(o => o.zoom);
      page.classList.remove('zoomed');
      ropes.forEach(o => o.card.classList.remove('flipped'));
      if (!r) { frozen = false; return; }
      r.card.style.transform = ropeTransform(r);      // 매달려 있던 자리로 되돌아간다
      setTimeout(() => {
        r.el.classList.remove('on');
        r.zoom = false;
        r.card.style.transition = '';
        r.card.style.transformOrigin = '';
        frozen = false;                               // 그 다음에 물리를 다시 돌린다
      }, ZOOM_MS);
    }
    closeBtn.addEventListener('click', close);
    dim.addEventListener('click', close);
    addEventListener('keydown', e => { if (e.key === 'Escape' && page.classList.contains('zoomed')) close(); });

    // 피그마 "마지막장": 카드 상단이 페이지 높이의 28.3% 지점(y=213 / 753)에 온다.
    // 줄 길이를 그 거리로 고정해야 카드가 제자리에 걸리고 옆 카드와 겹치지 않는다.
    // 카드마다 줄 길이가 다르다(피그마 49:1445 의 카드 상단 y 실측 / 753).
    // 1·3·4번은 157/180/212 로 잰 값이고, 2·5번은 조회 범위 밖이라 인접 값을 썼다.
    const HANG = [0.208, 0.300, 0.239, 0.282, 0.295];
    function layout(){
      const b = stage.getBoundingClientRect();
      ropes.forEach((r, i) => {
        const c = r.el.getBoundingClientRect();
        r.anchor.x = c.left - b.left + c.width / 2;
        r.anchor.y = 0;
        r.len = (b.height * (HANG[i] ?? 0.283)) / SEG;
        // 매번 쉬는 자리로 다시 세운다(리사이즈 때 줄 길이가 바뀌면 꼬인다)
        r.pts.length = 0;
        for (let i = 0; i <= SEG; i++) {
          const p = { x: r.anchor.x, y: r.anchor.y + i * r.len };
          r.pts.push({ ...p, px: p.x, py: p.y });
        }
      });
    }
    layout();
    addEventListener('resize', layout);

    function step(){
      if (frozen) { requestAnimationFrame(step); return; }   // 확대 중엔 전부 정지
      // 가만히 둬도 바람이 분다. 주기가 다른 사인 둘을 겹쳐 규칙적으로 안 보이게 하고,
      // 줄 끝으로 갈수록 세게 실어 실제로 매달린 것처럼 흔들리게 한다.
      const t = performance.now() * 0.001;
      for (const r of ropes) {
        const pts = r.pts;
        {
          const gust = Math.sin(t * 0.62 + r.phase) * 0.9 +
                       Math.sin(t * 1.73 + r.phase * 1.6) * 0.32;
          for (let i = 0; i < pts.length; i++) {      // 베를레 적분
            const p = pts[i];
            const vx = (p.x - p.px) * DAMP, vy = (p.y - p.py) * DAMP;
            p.px = p.x; p.py = p.y;
            p.x += vx + gust * 0.045 * (i / SEG);
            p.y += vy + GRAV;
          }
          for (let k = 0; k < ITER; k++) {            // 거리 구속
            pts[0].x = r.anchor.x; pts[0].y = r.anchor.y;
            if (r.drag) { const e = pts[SEG]; e.x = r.drag.x; e.y = r.drag.y; }
            for (let i = 0; i < SEG; i++) {
              const a = pts[i], c = pts[i + 1];
              const dx = c.x - a.x, dy = c.y - a.y;
              const d = Math.hypot(dx, dy) || 1e-4;
              const f = (d - r.len) / d * .5;
              const ox = dx * f, oy = dy * f;
              if (i > 0) { a.x += ox; a.y += oy; }
              if (!(r.drag && i + 1 === SEG)) { c.x -= ox; c.y -= oy; }
            }
          }
        }
        const end = pts[SEG];
        // 흔들릴 때 Y축으로 비틀린다 → 실제로 뒷면이 드러난다(3D 카드처럼).
        // 가로 속도에 비례해 돌리고 서서히 되돌아오게 감쇠를 준다.
        // 상한이 72도면 90도를 못 넘어 뒷면이 절대 안 나온다. 게인을 키우고 감쇠를
        // 늦춰 흔들 때 실제로 한 바퀴 가까이 돌게 한다(±200도).
        // 바람 정도의 미세한 속도로는 돌지 않는다. 데드존을 넘는 움직임(드래그 등)에만
        // 회전이 붙고, 그때는 90도를 넘겨 뒷면까지 보인다.
        const vx = end.x - end.px;
        const drive = Math.abs(vx) < 0.9 ? 0 : vx;
        r.spin = (r.spin || 0) * 0.94 + drive * 7;
        r.spin = Math.max(-200, Math.min(200, r.spin));
        r.card.style.transition = '';
        r.card.style.transform = ropeTransform(r) +
          ` rotateX(${r.tilt.x}deg) rotateY(${r.tilt.y + r.spin}deg)`;

        let d = `M ${pts[0].x} ${pts[0].y}`;
        for (let i = 1; i <= SEG; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
        r.paths[0].setAttribute('d', d);
        r.el.querySelectorAll('.rp-mid,.rp-sheen').forEach(p => p.setAttribute('d', d));

        // 워드마크를 줄 위에 일정 간격으로 얹는다. 접선 각도로 돌려 곡선을 따라간다.
        const strapW = r.card.offsetWidth * 0.0934;      // .rp-band stroke-width 와 같은 비율
        const LW = strapW * 2.6, LH = LW / 6.98;        // wordmark.svg 는 872x125
        r.logos.forEach((im, k) => {
          const idx = 2 + k * 2;                          // SEG=14 구간에 6개
          const p0 = pts[Math.max(0, idx - 1)], p1 = pts[Math.min(SEG, idx + 1)];
          const deg = Math.atan2(p1.y - p0.y, p1.x - p0.x) * 180 / Math.PI;
          im.setAttribute('x', -LW / 2); im.setAttribute('y', -LH / 2);
          im.setAttribute('width', LW);  im.setAttribute('height', LH);
          im.setAttribute('transform', `translate(${pts[idx].x},${pts[idx].y}) rotate(${deg})`);
        });
        r.clip.style.transform = `translate(${end.x}px,${end.y}px) translate(-50%,-50%)`;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();

  // ---- 페이지에 붙박인 영상(표지 · 탭 첫 장) ----
  // 스크롤이 없는 자리라 재생 시점은 페이지 전환이 정한다. 앞뒤 어느 쪽에서 넘어오든
  // 첫 프레임부터 다시 튼다. 떠날 때는 멈춰서 안 보이는 영상이 계속 돌지 않게 한다.
  function pageMedia(page, on){
    if (!page) return;
    page.querySelectorAll('.cover-video, .lead-page video').forEach(v => {
      if (!on) { v.pause(); return; }
      v.currentTime = 0;
      v.dataset.userPaused = '0';
      v.play().catch(() => {});
    });
  }

  // ripple on the round chevron buttons
  function addRipple(e){
    const btn = e.currentTarget, rect = btn.getBoundingClientRect();
    const d = Math.max(rect.width, rect.height);
    const r = document.createElement('span');
    r.className = 'ripple';
    r.style.width = r.style.height = d + 'px';
    r.style.left = (e.clientX - rect.left - d / 2) + 'px';
    r.style.top = (e.clientY - rect.top - d / 2) + 'px';
    btn.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  }

  const prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn');
  const nextIdx = () => idx >= pages.length - 1 ? 0 : idx + 1;   // wrap last → first
  prevBtn.addEventListener('click', e => { addRipple(e); show(idx - 1); });
  nextBtn.addEventListener('click', e => { addRipple(e); show(nextIdx()); });
  document.getElementById('nzLeft').addEventListener('click', () => show(idx - 1));
  document.getElementById('nzRight').addEventListener('click', () => show(nextIdx()));
  document.querySelector('[data-nav="cover"]').addEventListener('click', e => { e.preventDefault(); show(0); });
  pills.forEach(p => p.addEventListener('click', e => {
    e.preventDefault();
    addRipple(e);
    show(ids.indexOf(p.dataset.target));
  }));

  // theme toggle (light ↔ dark)
  document.getElementById('themeToggle').addEventListener('click', e => {
    addRipple(e);
    const root = document.documentElement;
    root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  // language toggle (KO ↔ EN): swaps text to its data-en (prebuilt, free — no API at runtime)
  let lang = 'ko';
  function setLang(l){
    document.querySelectorAll('[data-en]').forEach(el => {
      if (el._ko === undefined) el._ko = el.innerHTML;
      el.innerHTML = (l === 'en') ? el.getAttribute('data-en') : el._ko;
    });
  }
  document.getElementById('langToggle').addEventListener('click', e => {
    addRipple(e);
    lang = lang === 'ko' ? 'en' : 'ko';
    document.getElementById('langLabel').textContent = lang === 'ko' ? 'EN' : 'KO';
    document.documentElement.setAttribute('data-lang', lang);
    setLang(lang);
    retypePage(document.querySelector('.page.active'));
  });
  // On language switch: a very faint ShinyText sweep across the visible page (reactbits
  // ShinyText). Driven by the Web Animations API on background-position — no CSS `animation`
  // property is touched, so the page's .stagger entrance never replays (no rise), and no DOM
  // is rewritten (text can't break). A thin white glint keeps it subtle.
  function retypePage(page){
    if (!page) return;
    // Light mode = dark text, so a pure-white glint reads as a harsh flash. Soften it there:
    // a translucent, narrower highlight. Dark mode (white text) keeps the crisp white glint.
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    const grad = dark
      ? 'linear-gradient(110deg,currentColor 44%,#fff 50%,currentColor 56%)'
      : 'linear-gradient(110deg,currentColor 47%,rgba(255,255,255,.5) 50%,currentColor 53%)';
    page.querySelectorAll('h1,h2,h3,h4,h5,p,li,summary,.pill,.kicker,.tab').forEach(el => {
      if (!el.textContent.trim() || el.offsetParent === null) return;
      // drop the old sweep's handlers BEFORE cancelling — cancel() fires oncancel async,
      // which would otherwise wipe the fresh styles we set below (that was the "no replay" bug).
      if (el._shine) { el._shine.onfinish = el._shine.oncancel = null; el._shine.cancel(); }
      const clear = () => {
        el.style.backgroundImage = el.style.backgroundSize = '';
        el.style.webkitBackgroundClip = el.style.backgroundClip = '';
        el.style.webkitTextFillColor = '';
        el._shine = null;
      };
      el.style.backgroundImage = grad;
      el.style.backgroundSize = '200% 100%';
      el.style.webkitBackgroundClip = 'text'; el.style.backgroundClip = 'text';
      el.style.webkitTextFillColor = 'transparent';
      // start with the glint already at the right edge → visible the instant you press; quick sweep out left
      const a = el.animate([{ backgroundPosition: '0% 0' }, { backgroundPosition: '160% 0' }],
                           { duration: 650, easing: 'linear' });
      el._shine = a; a.onfinish = a.oncancel = clear;
    });
  }

  // toggle: springy height grow + single fade (no per-child flicker)
  function expandToggle(d, body){
    d.open = true;
    body.style.overflow = 'hidden';
    body.style.height = 'auto';
    const h = body.scrollHeight;
    body.style.height = '0px'; body.style.opacity = '0';
    void body.offsetHeight;   // commit start state, then transition
    body.style.transition = 'height .3s cubic-bezier(.22,.61,.36,1), opacity .26s ease';
    body.style.height = h + 'px'; body.style.opacity = '1';
    body.addEventListener('transitionend', function done(e){
      if (e.propertyName !== 'height') return;
      body.style.height = 'auto'; body.style.overflow = ''; body.style.transition = '';
      body.removeEventListener('transitionend', done);
    });
  }
  function collapseToggle(d, body){
    body.style.overflow = 'hidden';
    body.style.height = body.scrollHeight + 'px';
    void body.offsetHeight;
    body.style.transition = 'height .26s cubic-bezier(.22,.61,.36,1), opacity .24s ease';
    body.style.height = '0px'; body.style.opacity = '0';
    body.addEventListener('transitionend', function done(e){
      if (e.propertyName !== 'height') return;
      d.open = false;
      body.style.height = ''; body.style.opacity = ''; body.style.overflow = ''; body.style.transition = '';
      body.removeEventListener('transitionend', done);
    });
  }
  document.querySelectorAll('details.toggle').forEach(d => {
    const sum = d.querySelector(':scope > summary');
    const body = d.querySelector(':scope > .toggle-body');
    if (!sum || !body) return;
    sum.addEventListener('click', e => {
      e.preventDefault();
      d.open ? collapseToggle(d, body) : expandToggle(d, body);
    });
  });
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') show(nextIdx());
    if (e.key === 'ArrowLeft') show(idx - 1);
  });

  // In-app browsers (KakaoTalk, Instagram, Line…) can't do real fullscreen; their webview
  // instead jerks into a landscape "fullscreen-ish" mode. Detect them and skip fullscreen there.
  const inApp = /KAKAOTALK|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);

  // Double-tap on the COVER (page 1) only → go fullscreen.
  // Browsers won't let us block exit (Esc/back is always allowed); on Android the
  // physical back button is the intended way out, matching the kiosk request.
  function goFullscreen(){
    if (inApp) return;   // no-op in in-app browsers → prevents the KakaoTalk landscape flip
    const el = document.documentElement;
    if (document.fullscreenElement || !el.requestFullscreen) return;
    el.requestFullscreen().catch(() => {});
    // orientation is locked in the fullscreenchange handler below (most reliable timing)
  }
  // mobile: force portrait whenever we enter fullscreen (exhibition/manifest default is landscape)
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement && matchMedia('(max-width:640px)').matches
        && screen.orientation && screen.orientation.lock)
      screen.orientation.lock('portrait').catch(() => {});
  });
  let lastTap = 0;
  const coverPage = document.querySelector('.page[data-page="cover"]');
  coverPage.addEventListener('pointerup', () => {
    if (ids[idx] !== 'cover') return;
    const now = Date.now();
    if (now - lastTap < 330){ goFullscreen(); lastTap = 0; }
    else lastTap = now;
  });

  // Mobile: guide the user with a snackbar hint on the cover; double-tap enters fullscreen.
  // (A page can't auto-fullscreen on load — browsers require a user gesture.)
  // In-app browsers (KakaoTalk, etc.) don't support Fullscreen / orientation lock at all,
  // so there the hint becomes a "open in external browser" button instead.
  const fsHint = document.getElementById('fsHint');
  function updateHint(){
    if (!fsHint) return;
    const show = matchMedia('(max-width:640px)').matches && ids[idx] === 'cover'
                 && !document.fullscreenElement;
    fsHint.classList.toggle('show', show);
  }
  if (fsHint){
    if (inApp){
      fsHint.textContent = '전체화면은 브라우저에서 · 탭해서 열기';
      fsHint.setAttribute('data-en', 'Fullscreen needs a browser — tap to open');
      fsHint.addEventListener('click', () => {
        // KakaoTalk: force-open the current URL in the device's default browser
        if (/KAKAOTALK/i.test(navigator.userAgent))
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
      });
    } else {
      fsHint.addEventListener('click', goFullscreen);
      setTimeout(() => { if (ids[idx] === 'cover') fsHint.classList.remove('show'); }, 7000);  // auto-dismiss
    }
    document.addEventListener('fullscreenchange', updateHint);
  }

  // ---- lightbox with zoom / pan / pinch (Figma 이미지 확대) ----
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbZoom = document.getElementById('lbZoom');
  let scale = 1, tx = 0, ty = 0, baseW = 0;
  const MIN = 1, MAX = 8, STEP = 0.3;   // +/- steps 30%
  const lbStage = document.getElementById('lbStage');

  function computeBase(){
    // fit the image inside 86% × 78% of the stage, preserving aspect
    const sw = lbStage.clientWidth * 0.86, sh = lbStage.clientHeight * 0.78;
    const ar = (lbImg.naturalWidth || 1) / (lbImg.naturalHeight || 1);
    let bw = sw, bh = sw / ar;
    if (bh > sh) { bw = sh * ar; }
    baseW = bw;
  }
  function apply(){
    if (scale <= 1) { tx = 0; ty = 0; }
    // width-based zoom: the browser re-rasterizes from the full-res source at each size
    lbImg.style.width = (baseW * scale) + 'px';
    lbImg.style.height = 'auto';
    lbImg.style.transform = `translate(${tx}px,${ty}px)`;   // translate only → no raster stretching
    lbZoom.textContent = Math.round(scale * 100) + '%';
  }
  function setScale(s){ scale = Math.min(MAX, Math.max(MIN, s)); apply(); }
  function openLb(src){
    scale = 1; tx = 0; ty = 0;
    lightbox.classList.add('open');
    const ready = () => { computeBase(); apply(); };
    lbImg.src = src;
    if (lbImg.complete && lbImg.naturalWidth) ready();
    else lbImg.onload = ready;
    lightbox.animate([{opacity:0}, {opacity:1}], {duration:200, easing:'ease-out'});
    lbImg.animate([{opacity:.4}, {opacity:1}], {duration:300, easing:'ease-out'});
  }
  function closeLb(){ lightbox.classList.remove('open'); }

  document.addEventListener('click', e => {
    const fig = e.target.closest('figure.figure img');   // only inline content images, not the fixed media panel
    if (fig) openLb(fig.src);
  });
  document.getElementById('lbClose').addEventListener('click', e => { addRipple(e); closeLb(); });
  document.getElementById('lbPlus').addEventListener('click', e => { addRipple(e); setScale(scale + STEP); });
  document.getElementById('lbMinus').addEventListener('click', e => { addRipple(e); setScale(scale - STEP); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

  // wheel zoom
  document.getElementById('lbStage').addEventListener('wheel', e => {
    e.preventDefault();
    setScale(scale + (e.deltaY < 0 ? STEP : -STEP));
  }, { passive: false });

  // drag pan (mouse)
  let dragging = false, sx = 0, sy = 0;
  lbImg.addEventListener('pointerdown', e => {
    if (scale <= 1) return;
    dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
    lbImg.classList.add('grabbing'); lbImg.setPointerCapture(e.pointerId);
  });
  lbImg.addEventListener('pointermove', e => {
    if (!dragging) return;
    tx = e.clientX - sx; ty = e.clientY - sy; apply();
  });
  lbImg.addEventListener('pointerup', () => { dragging = false; lbImg.classList.remove('grabbing'); });

  // pinch zoom (touch)
  let pinchDist = 0, pinchBase = 1;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  lbImg.addEventListener('touchstart', e => {
    if (e.touches.length === 2) { pinchDist = dist(e.touches); pinchBase = scale; }
  }, { passive: false });
  lbImg.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchDist) {
      e.preventDefault();
      setScale(pinchBase * dist(e.touches) / pinchDist);
    }
  }, { passive: false });
  lbImg.addEventListener('touchend', e => { if (e.touches.length < 2) pinchDist = 0; });

  // smooth (lerped) custom cursor — mouse anywhere; on touch it appears while a finger drags
  const cursor = document.getElementById('cursor');
  let mx = innerWidth / 2, my = innerHeight / 2, cx = mx, cy = my;
  addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    mx = e.clientX; my = e.clientY;
  });
  // touch: same symbol follows the finger while it drags — use touch events (touchmove keeps
  // firing even during a light/scroll swipe, whereas pointermove cancels → needed a firm rub).
  addEventListener('touchstart', e => {
    const t = e.touches[0]; if (!t) return;
    mx = cx = t.clientX; my = cy = t.clientY;   // snap to finger
    cursor.classList.add('touch-on');
  }, { passive: true });
  addEventListener('touchmove', e => {
    const t = e.touches[0]; if (t) { mx = t.clientX; my = t.clientY; cursor.classList.add('touch-on'); }
  }, { passive: true });
  const cursorTouchEnd = () => cursor.classList.remove('touch-on');
  addEventListener('touchend', cursorTouchEnd, { passive: true });
  addEventListener('touchcancel', cursorTouchEnd, { passive: true });
  // hovering an interactive element swaps to the click-cursor icon
  addEventListener('pointerover', e => {
    if (e.pointerType === 'touch') return;
    const hit = e.target.closest && e.target.closest('button, summary, .pill, .pg-btn, figure.figure img, [data-nav], .lb-stepper button, .lb-close');
    cursor.classList.toggle('clicking', !!hit);
  });
  (function follow(){
    cx += (mx - cx) * 0.8; cy += (my - cy) * 0.8;   // near-instant, tiny smoothing only
    cursor.style.transform = `translate(${cx}px,${cy}px) translate(-50%,-50%)`;
    requestAnimationFrame(follow);
  })();

  // fade the scroll hint once the page is scrolled
  document.querySelectorAll('.page-scroll').forEach(sc => {
    sc.addEventListener('scroll', () => {
      const hint = sc.parentElement.querySelector('.scroll-hint');
      if (hint) hint.classList.toggle('hide', sc.scrollTop > 20);
    });
  });

  // ---- cover grainient (reactbits motion port): noise-driven gradient rotation ----
  // colors 100% from --cover-grad chips per theme; warp=0, grain=0; params from the
  // reference URL (timeSpeed 2.8, colorBalance -0.11, rotation 170). contrast/gamma/sat
  // left at 1.0 so the chips are reproduced unaltered.
  (function coverGrainient(){
    const cv = document.querySelector('.cover-canvas');
    if (!cv) return;
    const bookEl = document.getElementById('book');
    let gl, prog, U, lost = false;
    const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
    const FS = `#version 300 es
precision highp float;
uniform vec2 iResolution; uniform float iTime;
uniform float uTimeSpeed,uColorBalance,uWarpStrength,uWarpFrequency,uWarpSpeed,uWarpAmplitude,uBlendAngle,uRotationAmount,uNoiseScale,uZoom;
uniform vec3 uC0,uC1,uC2,uC3; uniform vec4 uStops;
out vec4 fragColor;
#define S(a,b,t) smoothstep(a,b,t)
mat2 Rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}
vec2 hash(vec2 p){p=vec2(dot(p,vec2(2127.1,81.17)),dot(p,vec2(1269.5,283.37)));return fract(sin(p)*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);float n=mix(mix(dot(-1.0+2.0*hash(i+vec2(0.,0.)),f-vec2(0.,0.)),dot(-1.0+2.0*hash(i+vec2(1.,0.)),f-vec2(1.,0.)),u.x),mix(dot(-1.0+2.0*hash(i+vec2(0.,1.)),f-vec2(0.,1.)),dot(-1.0+2.0*hash(i+vec2(1.,1.)),f-vec2(1.,1.)),u.x),u.y);return 0.5+0.5*n;}
vec3 grad4(float t){
  if(t<=uStops.x) return uC0;
  if(t<=uStops.y) return mix(uC0,uC1,(t-uStops.x)/(uStops.y-uStops.x));
  if(t<=uStops.z) return mix(uC1,uC2,(t-uStops.y)/(uStops.z-uStops.y));
  if(t<=uStops.w) return mix(uC2,uC3,(t-uStops.z)/(uStops.w-uStops.z));
  return uC3;
}
void main(){
  float t=iTime*uTimeSpeed;
  vec2 uv=gl_FragCoord.xy/iResolution.xy;
  float ratio=iResolution.x/iResolution.y;
  vec2 tuv=uv-0.5; tuv/=max(uZoom,0.001);
  float degree=noise(vec2(t*0.1,tuv.x*tuv.y)*uNoiseScale);
  tuv.y*=1.0/ratio;
  tuv*=Rot(radians((degree-0.5)*uRotationAmount+0.0));   // base 0° = red top, bright bottom
  tuv.y*=ratio;
  float ws=max(uWarpStrength,0.001);
  float amplitude=uWarpAmplitude/ws;   // warp≈0 when uWarpStrength=0
  float warpTime=t*uWarpSpeed;
  tuv.x+=sin(tuv.y*uWarpFrequency+warpTime)/amplitude;
  tuv.y+=sin(tuv.x*(uWarpFrequency*1.5)+warpTime)/(amplitude*0.5);
  float ax=(tuv*Rot(radians(uBlendAngle))).x;
  float pos=clamp(0.5 - tuv.y + uColorBalance + ax*0.18, 0.0, 1.0);
  fragColor=vec4(grad4(pos),1.0);
}`;
    const cssVars=getComputedStyle(document.documentElement);
    const hex=v=>{const h=cssVars.getPropertyValue(v).trim().replace('#','');
      return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255];};
    function applyColors(){
      if(!gl||lost) return;
      const dark=document.documentElement.getAttribute('data-theme')==='dark';
      const vars=dark?['--void','--oxblood','--crimson','--red']:['--red','--coral','--sand','--prism'];
      gl.uniform3fv(U('uC0'),hex(vars[0]));gl.uniform3fv(U('uC1'),hex(vars[1]));
      gl.uniform3fv(U('uC2'),hex(vars[2]));gl.uniform3fv(U('uC3'),hex(vars[3]));
      gl.uniform4f(U('uStops'),...(dark?[0.12,0.45,0.75,1.0]:[0.12,0.45,0.75,1.0]));
    }
    function resize(){
      if(!gl||lost) return;
      const dpr=Math.min(devicePixelRatio||1,2);
      const w=Math.max(1,cv.clientWidth*dpr|0),h=Math.max(1,cv.clientHeight*dpr|0);
      if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h);
        gl.uniform2f(U('iResolution'),w,h);}
    }
    // (Re)build every GL object — also called on context restore so the gradient never
    // permanently disappears if the tablet GPU drops the context.
    function initGL(){
      gl=cv.getContext('webgl2',{antialias:false,alpha:false});
      if(!gl) return false;                            // CSS --cover-grad fallback shows
      const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
        if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(o));return o;};
      prog=gl.createProgram();
      gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
      gl.linkProgram(prog);gl.useProgram(prog);
      const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
      const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
      U=n=>gl.getUniformLocation(prog,n);
      gl.uniform1f(U('uTimeSpeed'),2.0);
      gl.uniform1f(U('uColorBalance'),-0.11);
      gl.uniform1f(U('uWarpStrength'),1.0);
      gl.uniform1f(U('uWarpFrequency'),3.2);
      gl.uniform1f(U('uWarpSpeed'),1.2);
      gl.uniform1f(U('uWarpAmplitude'),16.0);
      gl.uniform1f(U('uBlendAngle'),0.0);
      gl.uniform1f(U('uRotationAmount'),38.0);
      gl.uniform1f(U('uNoiseScale'),1.2);
      gl.uniform1f(U('uZoom'),0.9);
      cv.width=0;                                      // force resize() to re-apply viewport/res
      applyColors(); resize();
      return true;
    }
    // context-loss recovery: keep the default from making the loss permanent, rebuild on restore
    cv.addEventListener('webglcontextlost',e=>{ e.preventDefault(); lost=true; }, false);
    cv.addEventListener('webglcontextrestored',()=>{ lost=false; initGL(); }, false);
    if(!initGL()) return;
    new MutationObserver(applyColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
    addEventListener('resize',resize);
    const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
    const t0=performance.now();
    // Only DRAW while the cover is actually on screen. On content pages the expensive WebGL
    // draw is skipped (huge GPU savings → no jank, far less chance of a context loss); the
    // rAF tick itself stays alive but is nearly free.
    function frame(now){
      if(!lost && gl && bookEl.classList.contains('is-cover')){
        resize();
        gl.uniform1f(U('iTime'),(now-t0)*0.001);
        gl.drawArrays(gl.TRIANGLES,0,3);
      }
      if(!reduce)requestAnimationFrame(frame);
    }
    if(reduce){ if(gl){gl.uniform1f(U('iTime'),8.0);} frame(t0); } else requestAnimationFrame(frame);
  })();

  // ---- click / touch spark + mouse footprint trail (reactbits ClickSpark + TextCursor) ----
  (function pointerFx(){
    const noMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;
    if (noMotion) return;
    // These follow the mouse anywhere (the "mouse area"), like the cursor — NOT frame-bound.
    // ClickSpark: 9 FA3030 rays burst from the pointer on every press
    addEventListener('pointerdown', e => {
      const b = document.createElement('div');
      b.className = 'spark-burst';
      b.style.left = e.clientX + 'px'; b.style.top = e.clientY + 'px';
      for (let i = 0; i < 9; i++) {
        const s = document.createElement('i');
        s.style.setProperty('--a', (i * 40) + 'deg');
        b.appendChild(s);
      }
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 560);
    }, {passive:true});
    // TextCursor: shoe silhouettes drop along the path (left foot first), rotated toward motion,
    // offset to alternate sides — FA3030, exclusion blend. Desktop = mouse move; touch = while a
    // finger is pressed & dragging ("rub-drag"), matching the symbol cursor.
    let lx = null, ly = null, foot = 0;
    const STEP = 28, SIDE = 7, MAX = 5;   // closer spacing, gentle side offset, short trail
    const pool = [];
    function dropStep(cxp, cyp) {
      if (lx === null) { lx = cxp; ly = cyp; return; }
      const dx = cxp - lx, dy = cyp - ly;
      if (Math.hypot(dx, dy) < STEP) return;
      const ang = Math.atan2(dy, dx);
      const px = -Math.sin(ang), py = Math.cos(ang);          // perpendicular unit
      const left = (foot % 2 === 0);                          // left foot first
      const side = left ? -SIDE : SIDE;
      const w = document.createElement('div');
      w.className = 'footstep' + (left ? '' : ' right');
      w.style.left = (cxp + px * side) + 'px';
      w.style.top  = (cyp + py * side) + 'px';
      w.style.setProperty('--r', (ang * 180 / Math.PI + 90) + 'deg');   // toe → motion dir
      document.body.appendChild(w);
      pool.push(w);
      while (pool.length > MAX) pool.shift().remove();        // cap the trail length
      setTimeout(() => { const k = pool.indexOf(w); if (k >= 0) pool.splice(k, 1); w.remove(); }, 1150);
      foot++; lx = cxp; ly = cyp;
    }
    const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
    // desktop mouse move
    addEventListener('pointermove', e => { if (e.pointerType !== 'touch' && fine) dropStep(e.clientX, e.clientY); }, {passive:true});
    // touch: touchmove fires throughout any drag (even light/scroll swipes) → light drag works
    addEventListener('touchstart', e => { const t = e.touches[0]; if (t) { lx = t.clientX; ly = t.clientY; } }, {passive:true});
    addEventListener('touchmove', e => { const t = e.touches[0]; if (t) dropStep(t.clientX, t.clientY); }, {passive:true});
    const stepEnd = () => { lx = ly = null; };
    addEventListener('touchend', stepEnd, {passive:true});
    addEventListener('touchcancel', stepEnd, {passive:true});
  })();

  // init: first page visible without a page-turn
  pages[0].classList.add('active');
  updateChrome();
  staggerIn(pages[0]);
</script>
</body>
</html>
