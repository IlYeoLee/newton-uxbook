  (function pointerFx(){
    const noMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;
    if (noMotion) return;
    // These follow the mouse anywhere (the "mouse area"), like the cursor — NOT frame-bound.
    // ClickSpark: 9 FA3030 rays burst from the pointer on every press
    addEventListener('pointerdown', e => {
      const b = document.createElement('div');
      b.className = 'spark-burst';
      b.style.left = e.clientX + 'px'; b.style.top = e.clientY + 'px';
      for (let i = 0; i < 9; i++) {
        const s = document.createElement('i');
        s.style.setProperty('--a', (i * 40) + 'deg');
        b.appendChild(s);
      }
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 560);
    }, {passive:true});
    // TextCursor: shoe silhouettes drop along the path (left foot first), rotated toward motion,
    // offset to alternate sides — FA3030, exclusion blend. Desktop = mouse move; touch = while a
    // finger is pressed & dragging ("rub-drag"), matching the symbol cursor.
    let lx = null, ly = null, foot = 0;
    const STEP = 28, SIDE = 7, MAX = 5;   // closer spacing, gentle side offset, short trail
    const pool = [];
    function dropStep(cxp, cyp) {
      if (lx === null) { lx = cxp; ly = cyp; return; }
      const dx = cxp - lx, dy = cyp - ly;
      if (Math.hypot(dx, dy) < STEP) return;
      const ang = Math.atan2(dy, dx);
      const px = -Math.sin(ang), py = Math.cos(ang);          // perpendicular unit
      const left = (foot % 2 === 0);                          // left foot first
      const side = left ? -SIDE : SIDE;
      const w = document.createElement('div');
      w.className = 'footstep' + (left ? '' : ' right');
      w.style.left = (cxp + px * side) + 'px';
      w.style.top  = (cyp + py * side) + 'px';
      w.style.setProperty('--r', (ang * 180 / Math.PI + 90) + 'deg');   // toe → motion dir
      document.body.appendChild(w);
      pool.push(w);
      while (pool.length > MAX) pool.shift().remove();        // cap the trail length
      setTimeout(() => { const k = pool.indexOf(w); if (k >= 0) pool.splice(k, 1); w.remove(); }, 1150);
      foot++; lx = cxp; ly = cyp;
    }
    const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
    // desktop mouse move
    addEventListener('pointermove', e => { if (e.pointerType !== 'touch' && fine) dropStep(e.clientX, e.clientY); }, {passive:true});

    addEventListener('touchstart', e => { const t = e.touches[0]; if (t) { lx = t.clientX; ly = t.clientY; } }, {passive:true});
    addEventListener('touchmove', e => { const t = e.touches[0]; if (t) dropStep(t.clientX, t.clientY); }, {passive:true});
    const stepEnd = () => { lx = ly = null; };
    addEventListener('touchend', stepEnd, {passive:true});
    addEventListener('touchcancel', stepEnd, {passive:true});
  })();

  // init: first page visible without a page-turn
  pages[0].classList.add('active');
  updateChrome();
  staggerIn(pages[0]);
</script>
  <!-- reactbits Lanyard (R3F + rapier). 크레딧 페이지에 들어갈 때만 붙인다. -->
  <script>
  // ── 아카이빙 갤러리 ──
  // reactbits Circular Gallery 와 같은 결: 가운데 한 장이 정면으로 서고, 양옆은
  // 원통을 따라 안쪽으로 돌아가며 물러난다. WebGL 없이 CSS 3D 로만 만든다.
  (function(){
    const stage = document.getElementById('arStage');
    if (!stage) return;
    const items = [...stage.querySelectorAll('.ar-item')];
    const page = stage.closest('.archive-page');
    const titleEl = page.querySelector('.ar-title');
    const curEl = page.querySelector('.ar-cur');
    let cur = 0;

    const STEP = 22;     // 이웃 한 칸당 돌아가는 각도
    const R = 46;        // 원통 반지름(cqw 대신 %로 환산해 쓰기 좋은 값)

    function layout(){
      const w = stage.clientWidth;
      items.forEach((el, i) => {
        const d = i - cur;
        const ad = Math.abs(d);
        // 5칸 밖은 아예 빼서 노드 수가 많아도 무겁지 않게 한다
        if (ad > 4){ el.style.opacity = 0; el.style.transform = 'translate(-50%,-50%) scale(.2)'; return; }
        const ang = d * STEP;
        const rad = ang * Math.PI / 180;
        const x = Math.sin(rad) * R * w / 100;
        const z = (Math.cos(rad) - 1) * R * w / 100;
        el.style.opacity = ad === 0 ? 1 : (ad === 1 ? 0.30 : ad === 2 ? 0.13 : 0);
        el.style.zIndex = String(50 - ad);
        el.style.transform =
          `translate(-50%,-50%) translate3d(${x}px,0,${z}px) rotateY(${-ang}deg) scale(${ad === 0 ? 1 : 0.78})`;
        el.classList.toggle('is-center', ad === 0);
      });
      const c = items[cur];
      if (c){
        curEl.textContent = String(cur + 1);
        // 묶음이 끝나면 타이틀이 저절로 바뀐다 — 각 장이 자기 묶음 이름을 갖고 있다.
        // 아카이빙 제목은 언제나 영문이다(한/영 전환과 무관).
        const en = c.dataset.en;
        if (titleEl.textContent !== en) titleEl.textContent = en;
      }
    }
    function go(n){ cur = Math.max(0, Math.min(items.length - 1, n)); layout(); }

    // 가운데 장을 누르면 기존 이미지 확대(라이트박스)와 똑같이 열린다
    stage.addEventListener('click', e => {
      const it = e.target.closest('.ar-item');
      if (!it) return;
      const i = items.indexOf(it);
      if (i !== cur){ go(i); return; }          // 옆 장을 누르면 그 장이 가운데로
      const img = it.querySelector('img');
      if (img && window.__openLb) window.__openLb(img.src);
    });

    // 드래그 / 휠 / 키보드
    let sx = null, moved = 0;
    stage.addEventListener('pointerdown', e => { sx = e.clientX; moved = 0; stage.classList.add('dragging'); });
    stage.addEventListener('pointermove', e => {
      if (sx === null) return;
      const d = e.clientX - sx;
      if (Math.abs(d) > stage.clientWidth * 0.06){ go(cur - Math.sign(d)); sx = e.clientX; moved += 1; }
    });
    const end = () => { sx = null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);
    stage.addEventListener('pointerleave', end);
    stage.addEventListener('wheel', e => {
      e.preventDefault();
      go(cur + (e.deltaY > 0 || e.deltaX > 0 ? 1 : -1));
    }, { passive: false });

    // 이 장에 있는 동안에는 좌우 페이지 버튼이 갤러리를 넘긴다.
    // 양 끝에 닿았을 때만 페이지가 넘어간다.
    window.__archiveNav = dir => {
      if (!page.classList.contains('active')) return false;
      const next = cur + dir;
      if (next < 0 || next >= items.length) return false;   // 끝 → 페이지 넘김
      go(next);
      return true;
    };

    layout();
    addEventListener('resize', layout);
  })();
  </script>

  <script>
  // 크레딧 페이지를 처음 펼칠 때 3D 목걸이를 붙인다. 무거우니 미리 만들지 않는다.
  (function(){
    const stage = document.getElementById('lanyStage');
    if (!stage) return;
    const page = stage.closest('.credits-page');
    let handle = null;

    function people(){
      return [...stage.querySelectorAll('.lany')].map(el => ({
        el: el.querySelector('.cc'),      // 이 노드를 복제해 3D 카드 위에 얹는다
        front: null,
        back: null
      }));
    }

    function boot(){
      if (handle || !window.NewtonLanyard) return;
      const list = people();
      if (!list.length) return;
      const host = document.createElement('div');
      host.className = 'lany3d-host';
      stage.appendChild(host);
      stage.classList.add('is3d');
      handle = window.NewtonLanyard.mount(host, {
        people: list,
        bandImage: 'assets/lanyard-band.png',
        onZoom: i => page.classList.toggle('zoomed', i !== null)
      });
      const closeBtn = page.querySelector('.cc-close');
      const dim = page.querySelector('.cc-dim');
      const close = () => handle && handle.close();
      if (closeBtn) closeBtn.addEventListener('click', close);
      if (dim) dim.addEventListener('click', close);
      addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    }

    // 이 책은 페이지를 전부 DOM 에 두고 .active 로만 바꾼다. 그래서
    // IntersectionObserver 로는 '지금 보이는 장'을 알 수 없었다. 게다가 boot 은
    // 번들(6.4MB, defer)이 아직 안 읽혔으면 그냥 빠져나가고 다시 시도하지 않아서,
    // 두 번째 진입에서야 붙는 일이 있었다. .active 를 지켜보고, 번들이 준비될
    // 때까지 기다린다.
    // 번들(6.4MB)은 이 장에 실제로 왔을 때만 불러온다. 표지에서부터 받아두면
    // WebGL 이 없거나 텍스처가 깨질 때 책 전체가 흰 화면이 된다.
    let loading = false;
    function tryBoot(){
      if (handle || !page.classList.contains('active')) return;
      if (!window.NewtonLanyard) {
        if (loading) return;
        loading = true;
        const s = document.createElement('script');
        s.src = 'assets/lanyard.bundle.js';
        s.onload = () => { loading = false; tryBoot(); };
        s.onerror = () => { loading = false; };   // 실패해도 책은 그대로 돌아간다
        document.body.appendChild(s);
        return;
      }
      try { boot(); } catch (e) { console.error('lanyard 3D 실패', e); }
    }
    new MutationObserver(tryBoot).observe(page, { attributes: true, attributeFilter: ['class'] });
    tryBoot();
  })();
